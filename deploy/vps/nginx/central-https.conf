server {
    listen 80;
    listen [::]:80;

    server_name mkautoparts.jksoftware.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://mkautoparts.jksoftware.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mkautoparts.jksoftware.com.br;

    ssl_certificate /etc/letsencrypt/live/mkautoparts.jksoftware.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mkautoparts.jksoftware.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Força a entrada pelo proxy da Cloudflare e bloqueia acesso direto ao IP da VPS.
        include /etc/nginx/conf.d/snippets/mk-autoparts-cloudflare-ips.conf;

        proxy_pass http://mk-autoparts:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name mkautoparts.jksoftware.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # O site permanece fechado durante a emissão do certificado e o preparo do proxy final.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503;
    }
}

name: mk-autoparts

services:
  web:
    # Mesmo digest já usado pelas landing pages da VPS; não depende de tag mutável.
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.25"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755,noexec,nosuid,nodev,size=16m
      - /var/run:uid=101,gid=101,mode=0755,noexec,nosuid,nodev,size=1m
      - /tmp:uid=101,gid=101,mode=0755,noexec,nosuid,nodev,size=4m
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - mk-autoparts
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/healthz 2>/dev/null | grep -qx ok
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: mk_autoparts_edge
    internal: true
    ipam:
      config:
        - subnet: 172.23.18.0/24

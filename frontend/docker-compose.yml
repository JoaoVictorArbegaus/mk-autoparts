# Sobe o protótipo da MK Autoparts: docker compose up -d --build
# Abre em http://localhost:8084 (outra porta: PORTA=3000 docker compose up -d --build)
name: mk-autoparts
services:
  site:
    build: .
    image: mk-autoparts-prototipo:latest
    ports:
      - "${PORTA:-8084}:80"
    restart: unless-stopped

# Sobe o protótipo da MK Autoparts: docker compose up -d --build
# Por padrão, expõe apenas em http://127.0.0.1:8084 para uso atrás de proxy reverso.
name: mk-autoparts
services:
  site:
    build:
      context: .
      args:
        VITE_SITE_URL: "${SITE_URL:-https://dominio-a-definir.invalid}"
    image: mk-autoparts-prototipo:latest
    ports:
      - "${IP_BIND:-127.0.0.1}:${PORTA:-8084}:80"
    restart: unless-stopped
